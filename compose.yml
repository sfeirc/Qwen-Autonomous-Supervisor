services:
  supervisor:
    build: .
    restart: unless-stopped
    init: true
    environment:
      QAS_CONFIG: /config/supervisor.yml
    env_file:
      - path: .env
        required: false
    volumes:
      - ./supervisor.yml:/config/supervisor.yml:ro
      - ${TARGET_REPOSITORY:?Set TARGET_REPOSITORY}:/workspace
      - qas-runtime:/runtime
    healthcheck:
      test: ["CMD", "qas", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  qas-runtime:

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomous-supervisor-e2e-test"
version = "0.1.0"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

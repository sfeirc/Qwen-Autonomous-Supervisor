[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qwen-autonomous-supervisor"
version = "0.1.2"
description = "Durable, crash-safe supervisor for bounded Qwen Code autonomy ticks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Qwen Autonomous Supervisor contributors" }]
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
qas = "qas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qas"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
markers = ["live_e2e: requires authenticated Qwen Code and a disposable GitHub repository"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"e2e/**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qas"]
